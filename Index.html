<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido de Empréstimo - Moçambique</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #087f5b;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      border: 0;
      border-radius: 7px;
      background: #087f5b;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 7px;
      background: #e8f5e9;
      color: #176b3a;
      line-height: 1.6;
    }

    .notice {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>MZLoan</h1>
  <p>Pedido de Empréstimo</p>
</header>

<div class="container">
  <div class="card">

    <h2>Solicite o seu empréstimo</h2>
    <p>Preencha os dados abaixo para enviar o pedido.</p>

    <form id="loanForm">

      <label for="name">Nome completo</label>
      <input
        id="name"
        type="text"
        placeholder="Digite o seu nome"
        required
      >

      <label for="phone">Número de telefone</label>
      <input
        id="phone"
        type="tel"
        placeholder="+258 84 000 0000"
        required
      >

      <label for="amount">Valor solicitado</label>
      <select id="amount" required>
        <option value="">Selecione o valor</option>
        <option value="1000">1.000 MT</option>
        <option value="2500">2.500 MT</option>
        <option value="5000">5.000 MT</option>
        <option value="10000">10.000 MT</option>
        <option value="20000">20.000 MT</option>
        <option value="50000">50.000 MT</option>
      </select>

      <label for="method">Método de recebimento</label>
      <select id="method" required>
        <option value="">Selecione</option>
        <option value="Carteira móvel">Carteira móvel</option>
        <option value="Conta bancária">Conta bancária</option>
      </select>

      <button id="submitBtn" type="submit">
        Enviar pedido
      </button>

    </form>

    <div id="result"></div>

    <p class="notice">
      DEMONSTRAÇÃO: este site não garante aprovação ou pagamento de empréstimo.
      Nunca introduza PIN, palavra-passe, OTP ou código de segurança neste site.
    </p>

  </div>
</div>

<script>
  const form = document.getElementById("loanForm");
  const button = document.getElementById("submitBtn");
  const result = document.getElementById("result");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    button.disabled = true;
    button.textContent = "A enviar...";

    const data = {
      name: document.getElementById("name").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      amount: document.getElementById("amount").value,
      method: document.getElementById("method").value
    };

    try {
      const response = await fetch("/api/loan", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      const responseData = await response.json();

      if (!response.ok) {
        throw new Error(responseData.error || "Erro");
      }

      result.style.display = "block";
      result.innerHTML =
        "<strong>Pedido recebido!</strong><br><br>" +
        "O seu pedido foi enviado para análise.";

      form.reset();

    } catch (error) {
      result.style.display = "block";
      result.style.background = "#ffebee";
      result.style.color = "#b71c1c";
      result.textContent =
        "Não foi possível enviar o pedido. Tente novamente.";
    }

    button.disabled = false;
    button.textContent = "Enviar pedido";
  });
</script>

</body>
  </html>
